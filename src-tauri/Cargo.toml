[package]
name = "robo-boy"
version = "0.3.1-alpha"
description = "Desktop shell for the Robo-Boy ROS 2 controller"
authors = ["Tessel LA"]
license = "MIT"
repository = "https://github.com/tessel-la/robo-boy"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "robo_boy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
