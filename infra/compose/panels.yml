services:
  panel-installer:
    image: ${ROBOBOY_PANEL_INSTALLER_IMAGE:-roboboy-panel-installer:local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.panel-installer
    command:
      - --config
      - /config/panel-sources.json
      - --output
      - /panels
    environment:
      - ROBOBOY_PANEL_WORKSPACE=/panel-workspace
    volumes:
      - ${ROBOBOY_PANEL_SOURCES_FILE:-./config/panel-sources.local.json}:/config/panel-sources.json:ro
      - ../robo-boy-hello-panel:/panel-workspace/robo-boy-hello-panel:ro
      - ../robo-boy-timeseries-panel:/panel-workspace/robo-boy-timeseries-panel:ro
      - ../robo-boy-webrtc-panel:/panel-workspace/robo-boy-webrtc-panel:ro
      - roboboy-installed-panels:/panels
    restart: "no"

  app:
    depends_on:
      panel-installer:
        condition: service_completed_successfully
    volumes:
      - roboboy-installed-panels:${ROBOBOY_PANEL_WEB_ROOT:-/app/public/panels}:ro

volumes:
  roboboy-installed-panels:
