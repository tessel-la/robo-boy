name: Electron Build

# Builds the Electron desktop shell's packages: Linux .debs for x64 and ARM64, where the shell exists
# because several distributions compile WebRTC out of WebKitGTK (what the Tauri build draws in), and
# a native Apple Silicon disk image for Macs, the same Chromium shell beside the Tauri app. Windows
# is left to Tauri: its web view has WebRTC and a second, much larger installer would add nothing.
#
# It publishes nothing. Release Please owns releases and calls this workflow for the packages it
# then attaches, exactly as it does for the Tauri installers. The pull-request trigger only checks
# the dev-to-main promotion; ordinary pull requests into dev use the regular frontend checks.
on:
  workflow_call:
    inputs:
      ref:
        description: Revision to build. Defaults to the triggering revision.
        type: string
        required: false
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'electron/**'
      - 'e2e/fixtures/robotResourceRenderer.ts'
      - 'src/**'
      - 'panel-sdk/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/**'
      - 'src-tauri/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'tsconfig.json'
      - '.github/workflows/electron-build.yml'
      - '.github/workflows/release-please.yml'

permissions:
  contents: read

concurrency:
  group: electron-build-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }} package (deb)
    # On a pull request this validates the promotion of dev into main before it lands, matching
    # the Tauri, iOS, and Android installer builds. Every other trigger is explicit.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'dev'
    # Both targets can be packaged on x64: the shell and renderer are JavaScript, and
    # electron-builder downloads the prebuilt Electron runtime for the requested architecture.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out the revision to build
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # esbuild transpiles the shell without type-checking it, and the renderer's tsc excludes it.
      - name: Type-check the Electron shell
        run: npm run typecheck:electron

      # The ordinary production build, against the tracked public tree. No panel staging happens
      # here, so nothing local reaches the package.
      - name: Build the renderer and the shell
        run: npm run build:electron

      - name: Verify the build bundles no panels
        env:
          ROBOBOY_DIST_DIR: dist-electron/renderer
        run: npm run check:release-panels

      - name: Package the Linux targets
        run: npx electron-builder --config config/electron-builder.yml --linux deb --${{ matrix.arch }} --publish never

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: release/*.deb

  macos:
    name: macOS ${{ matrix.arch }} app (dmg)
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'dev'
    # Apple Silicon runners, so the build signs and checks the app on the architecture it is for.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]

    steps:
      - name: Check out the revision to build
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check the Electron shell
        run: npm run typecheck:electron

      - name: Verify native robot assets and web proxy parity
        run: npm run test:robot-resources

      - name: Build the renderer and the shell
        run: npm run build:electron

      - name: Verify the build bundles no panels
        env:
          ROBOBOY_DIST_DIR: dist-electron/renderer
        run: npm run check:release-panels

      # The signature is ad-hoc (config/electron-builder.yml): no certificate or secret is involved,
      # so the pull-request build signs exactly as the release build does. electron-builder skips
      # signing on pull requests unless told otherwise, and an unsigned bundle would not run.
      - name: Package the macOS app
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npx electron-builder --config config/electron-builder.yml --mac dmg --${{ matrix.arch }} --publish never

      - name: Check the app is signed and built for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app="release/mac-${{ matrix.arch }}/Robo-Boy.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --display --verbose=2 "${app}" 2>&1 | grep -q 'Signature=adhoc'
          archs=$(lipo -archs "${app}/Contents/MacOS/Robo-Boy")
          echo "Executable architectures: ${archs}"
          [ "${archs}" = "${{ matrix.arch }}" ]

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: release/*.dmg
