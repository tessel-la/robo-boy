name: Desktop Build

# Builds the native installers with the ordinary Tauri production build, one native runner per
# platform. It publishes nothing: Release Please owns releases, and calls this workflow to produce
# the installers it then attaches.
on:
  workflow_call:
    inputs:
      ref:
        description: Revision to build. Defaults to the triggering revision.
        type: string
        required: false
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    # On a pull request this validates the promotion of dev into main before it lands, matching
    # how the Docker build test is gated. Every other trigger is explicit.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'dev'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported runner: the binary links against that runner's glibc and
          # will not start on anything older.
          - name: Linux installers (deb, rpm)
            runner: ubuntu-22.04
            bundles: deb,rpm
            artifact: linux
            bundle-dir: src-tauri/target/release/bundle
          # Built for both architectures: the macOS runners are Apple Silicon, so a default build
          # would produce a disk image that Intel Macs cannot run.
          - name: macOS installer (dmg, universal)
            runner: macos-latest
            bundles: dmg
            artifact: macos
            target: universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows installer (exe)
            runner: windows-latest
            bundles: nsis
            artifact: windows
            bundle-dir: src-tauri/target/release/bundle

    steps:
      - name: Check out the revision to build
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install dependencies
        run: npm ci

      # The ordinary production build: it runs the frontend build itself, against the tracked
      # public tree. No panel staging happens here, so nothing local reaches the installer.
      - name: Build desktop installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify the build bundles no panels
        run: npm run check:release-panels

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/rpm/*.rpm
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/nsis/*.exe
