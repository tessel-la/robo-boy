name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR or GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # Only once a release exists, and from its tag: the release commit is what carries the bumped
  # version, so installers built before it would be labelled with the previous one.
  desktop:
    name: Build desktop installers
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  publish-installers:
    name: Attach installers to the release
    needs: [release-please, desktop]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: desktop-*
          merge-multiple: true

      - name: Verify every platform produced an installer
        run: |
          set -euo pipefail
          missing=''
          for extension in deb rpm dmg exe; do
            if ! ls installers/*."${extension}" >/dev/null 2>&1; then
              missing="${missing} ${extension}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::release is missing installers for:${missing}"
            exit 1
          fi
          ls -la installers

      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" installers/* --clobber --repo "${GITHUB_REPOSITORY}"
