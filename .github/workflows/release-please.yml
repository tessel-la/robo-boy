name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR or GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # Only once a release exists, and from its tag: the release commit is what carries the bumped
  # version, so installers built before it would be labelled with the previous one.
  desktop:
    name: Build desktop installers
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  # Best effort, unlike the installers. The iPhone app is the one build that cannot be signed, and
  # a release of four working installers should not be withheld because it failed.
  iphone:
    name: Build the iPhone app
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  publish-installers:
    name: Attach installers to the release
    needs: [release-please, desktop, iphone]
    # Runs even when the iPhone build failed, which is what makes that build optional; the desktop
    # installers are still required, and a release without them publishes nothing.
    if: >-
      ${{ !cancelled()
      && needs.release-please.outputs.release_created == 'true'
      && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: desktop-*
          merge-multiple: true

      - name: Download the built iPhone app
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: iphone
          pattern: ios-*
          merge-multiple: true

      # A built installer carries the version in its name, so nothing can link to one before the
      # release exists. Each is copied to a name that does not change, giving
      # /releases/latest/download a target that keeps working across releases. The versioned file
      # is published as well, so a downloaded installer still says which version it is.
      - name: Verify every platform produced an installer and name a stable copy
        run: |
          set -euo pipefail
          declare -A stable_name=(
            [deb]=Robo-Boy-linux-amd64.deb
            [rpm]=Robo-Boy-linux-x86_64.rpm
            [dmg]=Robo-Boy-macos-universal.dmg
            [exe]=Robo-Boy-windows-x64-setup.exe
          )
          mkdir -p stable
          missing=''
          for extension in deb rpm dmg exe; do
            mapfile -t built < <(find installers -type f -name "*.${extension}")
            case "${#built[@]}" in
              0) missing="${missing} ${extension}" ;;
              1) cp "${built[0]}" "stable/${stable_name[${extension}]}" ;;
              *) echo "::error::found ${#built[@]} .${extension} installers, so no stable name can name one"
                 exit 1 ;;
            esac
          done
          if [ -n "${missing}" ]; then
            echo "::error::release is missing installers for:${missing}"
            exit 1
          fi

          # The iPhone app needs no stable copy: it is published unsigned, so its name carries the
          # platform rather than a version, and the version it was built from is inside the bundle.
          # Its absence is reported rather than fatal, so the installers still reach the release.
          mkdir -p iphone
          if [ ! -f iphone/Robo-Boy-iphone-unsigned.ipa ]; then
            echo "::warning::no iPhone app in this release; the iOS build produced none"
          fi

          find installers stable iphone -type f

      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find installers stable iphone -type f)
          gh release upload "${TAG_NAME}" "${installers[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
